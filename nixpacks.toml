# nixpacks.toml — tells Railway's Nixpacks builder what system packages to install
# ffmpeg is required for yt-dlp to convert audio to MP3 and embed metadata

[phases.setup]
nixPkgs = ["ffmpeg", "python312"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "python -c 'import static_ffmpeg; static_ffmpeg.add_paths()'"
]

[start]
cmd = "gunicorn app:app --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT"
